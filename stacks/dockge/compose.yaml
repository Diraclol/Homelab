services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports: ["127.0.0.1:5001:5001"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data:z
      - /var/mnt/storage/docker/stacks:/var/mnt/storage/docker/stacks:z
    environment:
      - DOCKGE_STACKS_DIR=/var/mnt/storage/docker/stacks
